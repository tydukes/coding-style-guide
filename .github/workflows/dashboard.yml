name: Update Project Dashboard

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'scripts/analyze_code_ratio.py'
      - 'scripts/generate_dashboard.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache UV dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync environment
        run: uv sync

      - name: Generate dashboard
        run: |
          uv run python scripts/generate_dashboard.py

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet docs/project_status.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Open dashboard update PR
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/project-dashboard"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          fi
          git switch -C "${BRANCH}"
          git add docs/project_status.md
          git commit -m "docs(dashboard): update project health"
          git push --force-with-lease origin "${BRANCH}"

          PR_NUMBER=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "${PR_NUMBER}" ]; then
            echo "Dashboard update PR already open: #${PR_NUMBER}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${BRANCH}" \
              --title "docs(dashboard): update project health" \
              --body "Automated project health dashboard refresh."
          fi

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Dashboard updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to dashboard" >> $GITHUB_STEP_SUMMARY
          fi
