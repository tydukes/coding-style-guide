name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Cache UV dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync environment
        run: uv sync --frozen --no-build

      - name: Validate metadata
        run: uv run --frozen --no-build python scripts/validate_metadata.py docs/
        continue-on-error: true

      - name: Run lint checks
        run: bash scripts/pre_commit_linter.sh

      - name: Build documentation
        run: uv run --frozen --no-build mkdocs build --strict

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation
          path: site/
          retention-days: 7
