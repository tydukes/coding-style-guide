[project]
name = "coding-style-guide"
version = "1.8.24"
description = "Comprehensive coding style guide and best practices documentation"
requires-python = ">=3.10"
dependencies = [
    "mike>=2.1.4",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pre-commit>=4.3.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "pytest>=9.0.3",
]
